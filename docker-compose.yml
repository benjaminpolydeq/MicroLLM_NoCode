version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: microllm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: microllm_user
      POSTGRES_PASSWORD: microllm_pass_2024
      POSTGRES_DB: microllm
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microllm_user -d microllm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour rate limiting et cache
  redis:
    image: redis:7-alpine
    container_name: microllm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API FastAPI
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: microllm_backend
    restart: unless-stopped
    environment:
      # Database
      DATABASE_URL: postgresql://microllm_user:microllm_pass_2024@postgres:5432/microllm
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      
      # App config
      APP_NAME: MicroLLM SaaS
      DEBUG: ${DEBUG:-True}
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8501
      
      # Email (optionnel)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data  # Accès aux datasets JSON existants
      - ./templates:/app/templates  # Accès aux templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  # Frontend Streamlit (ton interface actuelle améliorée)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: microllm_frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      STREAMLIT_SERVER_PORT: 8501
      STREAMLIT_SERVER_ADDRESS: 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    command: streamlit run streamlit_app.py --server.address 0.0.0.0

  # PgAdmin (optionnel - pour gérer la BDD visuellement)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: microllm_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@microllm.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    profiles:
      - tools  # Démarrer avec: docker-compose --profile tools up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  default:
    name: microllm_network
